<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">GreenScan broccoli scanner logo</title>
  <desc id="desc">A broccoli icon inside a scanner frame for GreenScan search previews.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062015"/>
      <stop offset="0.55" stop-color="#0a3423"/>
      <stop offset="1" stop-color="#102f22"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cf6a5"/>
      <stop offset="1" stop-color="#16c978"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="56" fill="url(#bg)"/>
  <circle cx="280" cy="140" r="160" fill="#18e586" opacity="0.14"/>
  <circle cx="980" cy="520" r="210" fill="#49f0c1" opacity="0.10"/>
  <g filter="url(#shadow)">
    <rect x="248" y="110" width="704" height="410" rx="72" fill="#0e2b1f" stroke="#79f2bc" stroke-width="8"/>
    <path d="M326 218v-56h56M818 162h56v56M382 468h-56v-56M874 412v56h-56" fill="none" stroke="#dfffee" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M392 342h416" stroke="#32e391" stroke-width="12" stroke-linecap="round" opacity="0.88"/>
    <g transform="translate(456 176)">
      <circle cx="102" cy="76" r="58" fill="url(#leaf)"/>
      <circle cx="172" cy="72" r="68" fill="url(#leaf)"/>
      <circle cx="242" cy="82" r="56" fill="url(#leaf)"/>
      <circle cx="132" cy="134" r="64" fill="url(#leaf)"/>
      <circle cx="214" cy="138" r="62" fill="url(#leaf)"/>
      <path d="M166 182c-6 52-26 94-60 128 56 8 118 8 174 0-36-32-56-74-62-128z" fill="#b9f7ce"/>
      <path d="M172 188c-8 44-26 82-54 112M212 188c8 44 26 82 54 112" fill="none" stroke="#33a76c" stroke-width="12" stroke-linecap="round"/>
    </g>
  </g>
